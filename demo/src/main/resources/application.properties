# Server port — Spring Boot runs on 8080
server.port=8081

# App name
spring.application.name=ai-reformatter

# PostgreSQL Database (we will set this up later)
# For now using H2 in-memory database for testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Django AI service URL
django.ai.service.url=http://localhost:8000/api/reformat/

# JWT Secret key
jwt.secret=mySecretKey123456789012345678901234567890
jwt.expiration=86400000